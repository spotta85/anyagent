# Release binaries for every supported target, plus the wire schema.
# A tag `v*` publishes a GitHub release; a pull request that touches this
# file, or a manual run, builds everything and stops at the artifacts — a
# manual run with `npm: true` or `pypi: true` also publishes those packages.
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:
    inputs:
      npm:
        description: "Publish the npm packages from this run"
        type: boolean
        default: false
      pypi:
        description: "Publish the PyPI package from this run"
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, container: quay.io/pypa/manylinux_2_28_x86_64 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm, container: quay.io/pypa/manylinux_2_28_aarch64 }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    # Linux builds inside a manylinux_2_28 container so the binary links against
    # glibc 2.28 (Ubuntu 20.04, Debian 10, RHEL 8 and up) instead of the runner's;
    # the other targets have no container and build on the host.
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --bin anyagent --target ${{ matrix.target }}
      - uses: astral-sh/setup-uv@v10.1.0
      - name: The Python wheel for this target (reuses the build above)
        run: uvx maturin build --release --locked --target ${{ matrix.target }} --out ../../dist
        working-directory: packages/python
      - name: Name the binary after its target
        shell: bash
        run: |
          ext=""
          [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/anyagent$ext" "dist/anyagent-${{ matrix.target }}$ext"
      - uses: actions/upload-artifact@v4
        with:
          name: anyagent-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: macos-latest # lipo
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Universal mac binary, schema, checksums (the wheels are in dist too)
        run: |
          lipo -create dist/anyagent-x86_64-apple-darwin dist/anyagent-aarch64-apple-darwin -output dist/anyagent-macos-universal
          cp packages/schema.json dist/schema.json
          (cd dist && shasum -a 256 * > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/*
      - if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes || gh release upload "$GITHUB_REF_NAME" dist/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Tag the Go module too (`go get` resolves packages/go/vX.Y.Z; SwiftPM uses the vX.Y.Z tag as is)
        if: startsWith(github.ref, 'refs/tags/')
        run: git tag "packages/go/$GITHUB_REF_NAME" && git push origin "packages/go/$GITHUB_REF_NAME"

  npm:
    needs: release
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.npm == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: Each binary into its platform package, then publish all six (a rerun skips versions already on npm)
        working-directory: packages/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cp ../../dist/anyagent-aarch64-apple-darwin platform/darwin-arm64/bin/anyagent
          cp ../../dist/anyagent-x86_64-apple-darwin platform/darwin-x64/bin/anyagent
          cp ../../dist/anyagent-x86_64-unknown-linux-gnu platform/linux-x64/bin/anyagent
          cp ../../dist/anyagent-aarch64-unknown-linux-gnu platform/linux-arm64/bin/anyagent
          cp ../../dist/anyagent-x86_64-pc-windows-msvc.exe platform/win32-x64/bin/anyagent.exe
          chmod +x platform/*/bin/anyagent*
          (cd anyagent && npm install --omit=optional && npm run build)
          for p in platform/*/ anyagent/; do
            (cd "$p" && npm view "$(jq -r '.name + "@" + .version' package.json)" version >/dev/null 2>&1 || npm publish --access public)
          done

  pypi:
    needs: release
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.pypi == 'true'
    runs-on: ubuntu-latest
    environment: pypi # trusted publishing: no token, PyPI trusts this workflow
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - run: mkdir wheels && mv dist/*.whl wheels/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheels
          skip-existing: true # a rerun skips a version already on PyPI
